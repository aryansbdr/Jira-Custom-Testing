permissions:
  scopes:
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - 'https://*.loca.lt'

modules:
  jira:issueActivity:
    - key: subtask-recommendation-activity
      resource: main
      resolver:
        function: resolver-fn
      title: Sub-Task Recommendations
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  jira:projectPage:
    - key: custom-reports-with-filter
      title: Reports Overview
      resource: main
      resolver:
        function: resolver-fn
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue.svg

  function:
    - key: resolver-fn
      handler: index.handler

resources:
  - key: main
    path: frontend/build

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/8ca09d8a-834f-4d0c-9e63-2f77acc3f4ff