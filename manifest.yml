permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - 'https://*.loca.lt'
        - 'https://*.trycloudflare.com'

modules:
  jira:issueActivity:
    - key: subtask-recommendation-activity
      resource: main
      resolver:
        function: resolver-fn
      title: Sub-Task Recommendations
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg

  jira:projectPage:
    - key: custom-reports-with-filter
      resource: main
      resolver:
        function: resolver-fn
      title: Reports Overview
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-activity.svg

  function:
    - key: resolver-fn
      handler: index.handler

resources:
  - key: main
    path: frontend/build
    tunnel:
      port: 3000

app:
  id: ari:cloud:ecosystem::app/8ca09d8a-834f-4d0c-9e63-2f77acc3f4ff
  runtime:
    name: nodejs22.x
