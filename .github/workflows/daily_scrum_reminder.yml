name: Daily Scrum & Sprint Reminder (Telegram)

on:
  schedule:
    # 01:15 UTC = 08:15 WIB (Pagi sebelum Daily Standup, Senin-Jumat - Diatur di menit sepi agar bebas antrian)
    - cron: '15 1 * * 1-5'
    # 09:30 UTC = 16:30 WIB (Sore Wrap-up Harian, Senin-Jumat)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Tombol manual trigger di web GitHub Actions

jobs:
  send-scrum-reminder:
    name: Send Automated Telegram Reminder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Branch
        uses: actions/checkout@v4
        with:
          ref: backend

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Telegram Sprint Reminder
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_STORY_POINTS_FIELD: ${{ secrets.JIRA_STORY_POINTS_FIELD || 'customfield_10106' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
        run: |
          python -c "
          import sys, datetime, zoneinfo
          sys.path.insert(0, 'src')
          from modules.notification.infrastructure.notification_scheduler import NotificationSchedulerService
          
          scheduler = NotificationSchedulerService()
          target_project = '${{ vars.TARGET_PROJECT_KEY || 'JT' }}'
          now_wib = datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Jakarta'))
          print(f'[Cloud GitHub Actions] Execution time: {now_wib.strftime(\"%Y-%m-%d %H:%M:%S WIB\")}')
          
          if now_wib.hour >= 14:
              print(f'[Cloud GitHub Actions] Triggering Afternoon Wrap-up Reminder (16:00 WIB) for project: {target_project}')
              scheduler.run_afternoon_reminder(target_project)
          else:
              print(f'[Cloud GitHub Actions] Triggering Morning Standup Reminder (08:15 WIB) for project: {target_project}')
              scheduler.run_morning_reminder(target_project)
          "
