name: Daily Scrum & Sprint Reminder (Telegram)

on:
  schedule:
    # 01:45 UTC = 08:45 WIB (Pagi sebelum Daily Standup, Senin-Jumat)
    - cron: '45 1 * * 1-5'
    # 09:30 UTC = 16:30 WIB (Sore Wrap-up Harian, Senin-Jumat)
    - cron: '30 9 * * 1-5'
    # Test cron trigger untuk jam 15:30 WIB (08:30 UTC)
    - cron: '30 8 * * *'
  workflow_dispatch: # Tombol manual trigger di web GitHub Actions

jobs:
  send-scrum-reminder:
    name: Send Automated Telegram Reminder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Branch
        uses: actions/checkout@v4
        with:
          ref: backend

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Telegram Sprint Reminder
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_STORY_POINTS_FIELD: ${{ secrets.JIRA_STORY_POINTS_FIELD || 'customfield_10106' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from modules.notification.infrastructure.notification_scheduler import NotificationSchedulerService
          
          scheduler = NotificationSchedulerService()
          target_project = '${{ vars.TARGET_PROJECT_KEY || 'JT' }}'
          print(f'[Cloud GitHub Actions] Triggering Sprint Reminder for project: {target_project}')
          scheduler.run_morning_reminder(target_project)
          "
